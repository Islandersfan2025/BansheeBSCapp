<body>
  <section class="banshee-stage" id="stage" aria-label="Banshee.BNB music marketplace UI">
    <div class="embedded-art"></div>
    <div class="scanline"></div>

    <button class="hotspot profile-button" onclick="showToast('MetaMask Agent profile coming soon')">
      <span class="tooltip-label">User Profile: Agent</span>
    </button>

    <button class="hotspot drop-1" onclick="selectDrop(0)"><span class="tooltip-label">Play / Mint Spray Mints</span></button>
    <button class="hotspot drop-2" onclick="selectDrop(1)"><span class="tooltip-label">Play / Mint Track 03</span></button>
    <button class="hotspot drop-3" onclick="selectDrop(2)"><span class="tooltip-label">Play / Mint Spray Track</span></button>
    <button class="hotspot drop-4" onclick="selectDrop(3)"><span class="tooltip-label">Play / Mint Track HPV</span></button>
    <button class="hotspot drop-5" onclick="selectDrop(4)"><span class="tooltip-label">Play / Mint Track V20</span></button>
    <button class="hotspot drop-6" onclick="selectDrop(5)"><span class="tooltip-label">Play / Mint Track Mint</span></button>

    <button class="hotspot about-panel" onclick="showToast('About Banshee Proof-of-Performance')"><span class="tooltip-label">About</span></button>
    <button class="hotspot roadmap-panel" onclick="showToast('Roadmap: Core, Agent, Expansion')"><span class="tooltip-label">Roadmap</span></button>

    <button class="hotspot team-1" onclick="showToast('Banshee Dev — Protocol')"><span class="tooltip-label">Banshee Dev</span></button>
    <button class="hotspot team-2" onclick="showToast('Banshee AI — Agent Ops')"><span class="tooltip-label">Banshee AI</span></button>
    <button class="hotspot team-3" onclick="showToast('Urban AI — Verifier')"><span class="tooltip-label">Urban AI</span></button>
    <button class="hotspot team-4" onclick="showToast('UrbanZ — Greenfield')"><span class="tooltip-label">UrbanZ</span></button>

    <a class="hotspot x-link" href="#" onclick="showToast('Opening X community'); return false;"><span class="tooltip-label">X Community</span></a>
    <a class="hotspot discord-link" href="#" onclick="showToast('Opening Discord'); return false;"><span class="tooltip-label">Discord</span></a>

    <button class="hotspot player-click" onclick="togglePlayback()"><span class="tooltip-label">Toggle Player</span></button>

    <div class="toast-panel" id="toastPanel">Ready</div>

  <div class="mobile-note">
    Embedded single-file demo. Tap the cards, profile, socials, roadmap, or player area.
  </div>

  <script>
    const stage = document.getElementById('stage');
    const toastPanel = document.getElementById('toastPanel');

    let listings = [
      { id: 1, title: 'SPRAY MINTS', artistName: 'Banshee', priceWei: '0', greenfieldObject: 'demo/spray-mints.mp3' },
      { id: 2, title: 'TRACK 03', artistName: 'Banshee', priceWei: '0', greenfieldObject: 'demo/track-03.mp3' },
      { id: 3, title: 'SPRAY TRACK', artistName: 'Akltat Torrage', priceWei: '0', greenfieldObject: 'demo/spray-track.mp3' },
      { id: 4, title: 'TRACK HPV', artistName: 'Urban AI', priceWei: '0', greenfieldObject: 'demo/track-hpv.mp3' },
      { id: 5, title: 'TRACK V20', artistName: 'Banshee Agent', priceWei: '0', greenfieldObject: 'demo/track-v20.mp3' },
      { id: 6, title: 'TRACK MINT', artistName: 'MetaMask Radio', priceWei: '0', greenfieldObject: 'demo/track-mint.mp3' }
    ];

    let playing = false;
    let toastTimer;

    async function loadListings() {
      try {
        const response = await fetch('/api/listings');
        if (!response.ok) throw new Error('Failed to load listings');
        const data = await response.json();
        if (Array.isArray(data.listings) && data.listings.length > 0) {
          listings = data.listings;
          showToast(`${listings.length} agent ticket listings loaded`);
        }
      } catch (error) {
        console.warn(error);
        showToast('Using demo listings');
      }
    }

    function showToast(message) {
      toastPanel.textContent = message;
      toastPanel.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastPanel.classList.remove('show'), 1800);
    }

    async function selectDrop(index) {
      const listing = listings[index % listings.length];

      playing = true;
      showToast(`${listing.title || 'Drop'} selected — requesting ticket`);

      sprayBurst(window.innerWidth * 0.5, window.innerHeight * 0.5, index);

      try {
        const wallet = await getConnectedWallet();

        const response = await fetch('/api/tickets/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            listingId: listing.id,
            recipient: wallet,
            reason: 'frontend-play-mint'
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Ticket request failed');
        }

        if (result.txHash) {
          showToast(`Ticket sent: ${result.txHash.slice(0, 10)}...`);
        } else {
          showToast('Ticket request accepted by AI agent');
        }
      } catch (error) {
        console.error(error);
        showToast(error.message || 'Ticket request failed');
      }
    }

    async function getConnectedWallet() {
      if (!window.ethereum) {
        throw new Error('MetaMask not found');
      }

      const accounts = await window.ethereum.request({
        method: 'eth_requestAccounts'
      });

      if (!accounts || accounts.length === 0) {
        throw new Error('No wallet connected');
      }

      return accounts[0];
    }

    function togglePlayback() {
      playing = !playing;
      showToast(playing ? 'Playback started' : 'Playback paused');
      sprayBurst(window.innerWidth * 0.47, window.innerHeight * 0.93, playing ? 1 : 2);
    }

    const colors = ['#04d9ff', '#ff2f86', '#ff6a20', '#7a37ff', '#ffd441'];

    function sprayBurst(x, y, seed = 0) {
      const rect = stage.getBoundingClientRect();
      const localX = x - rect.left;
      const localY = y - rect.top;

      for (let i = 0; i < 12; i++) {
        const dot = document.createElement('span');
        dot.className = 'paint-dot';
        const color = colors[(seed + i) % colors.length];
        dot.style.setProperty('--paint', color);
        dot.style.left = `${localX + (Math.random() - 0.5) * 120}px`;
        dot.style.top = `${localY + (Math.random() - 0.5) * 86}px`;
        stage.appendChild(dot);
        setTimeout(() => dot.remove(), 1600);
      }
    }

    let lastSpray = 0;

    stage.addEventListener('mousemove', (event) => {
      const now = Date.now();
      if (now - lastSpray > 190) {
        sprayBurst(event.clientX, event.clientY, Math.floor(Math.random() * colors.length));
        lastSpray = now;
      }
    });

    stage.addEventListener('click', (event) => {
      sprayBurst(event.clientX, event.clientY, Math.floor(Math.random() * colors.length));
    });

    loadListings();
  </script>
</body>
</html>
